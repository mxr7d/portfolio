name: Deploy Portfolio

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Recreate Code Folders
        run: |
          echo "Creating missing folders..."
          mkdir -p src
          
          echo "Moving core files into src..."
          # Move your main TSX and CSS files into the src directory
          [ -f "main.tsx" ] && mv main.tsx src/
          [ -f "App.tsx" ] && mv App.tsx src/
          [ -f "index.css" ] && mv index.css src/
          [ -f "vite-env.d.ts" ] && mv vite-env.d.ts src/

          echo "Moving component sub-files into src..."
          # Move all your loose component portfolio files into src/
          mv About.tsx Contact.tsx Education.tsx Experience.tsx Footer.tsx GlobeCanvas.tsx Hero.tsx Navigation.tsx Projects.tsx ScrollProgress.tsx Skills.tsx src/

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
